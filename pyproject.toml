[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-phasebias"
version = "1.0.0"
description = "Phase-bias correction for short-term, multilooked InSAR interferograms (Maghsoudi et al. 2022)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Yasamin Maghsoudi" },
    { name = "Milan Lazecky" },
]
keywords = ["InSAR", "interferogram", "phase bias", "loop closure", "time series"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "rasterio",
    # Prebuilt GDAL wheels (provides `osgeo`); system GDAL otherwise.
    "gdal-wheel>=3.4; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'amd64'",
]

[project.scripts]
phasebias-01-read-data = "phasebias.cli:p01"
phasebias-02-loop-closures = "phasebias.cli:p02"
phasebias-03-calibration-pars = "phasebias.cli:p03"
phasebias-04-inversion = "phasebias.cli:p04"
phasebias-05-correction = "phasebias.cli:p05"

[project.urls]
Homepage = "https://github.com/comet-licsar/InSAR_PhaseBias_Correction"
Issues = "https://github.com/comet-licsar/InSAR_PhaseBias_Correction/issues"

[tool.setuptools.packages.find]
include = ["phasebias", "phasebias.*"]
